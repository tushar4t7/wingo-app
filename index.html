<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNICE WinGo Pro - Overlay Hack</title>
    <style>
        :root {
            --primary-red: #ff4d4d;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            background: #0f172a;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        /* আসল গেমের পেজ ব্যাকগ্রাউন্ডে লোড করার ফ্রেম */
        .game-iframe {
            width: 100%;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.4; /* হালকা ঝাপসা রাখা যাতে ওভারলে ক্লিয়ার দেখা যায় */
            pointer-events: auto;
        }
        /* ওপরে ভেসে থাকা হ্যাক বা সিগন্যাল বক্স (ছবির মতো) */
        .overlay-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
            z-index: 10;
        }
        .overlay-title {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
            padding-bottom: 8px;
        }
        .period-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .prediction-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .accuracy-bar {
            font-size: 0.8rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-exit { background: #ef4444; color: white; }
        .btn-hide { background: #334155; color: white; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- আসল গেমের লিংক এখানে বসবে যাতে রিয়েল ডাটা ব্যাকগ্রাউন্ডে থাকে -->
        <!-- (বিঃদ্রঃ কিছু গেম সিকিউরিটি কারণে আইফ্রেমে লোড হতে বাধা দিতে পারে) -->
        <iframe class="game-iframe" id="gameFrame" src="about:blank"></iframe>

        <!-- ছবির মতো হ্যাক ওভারলে উইন্ডো -->
        <div class="overlay-box" id="overlayBox">
            <div class="overlay-title">SH TEAM SERVER HACK<br><span style="font-size: 0.7rem; color: #94a3b8;">SERVER CONNECT ENGINE</span></div>
            
            <div class="period-badge">
                PERIOD: <span id="live-period" style="font-weight: bold; color: white;">Connecting...</span>
            </div>

            <div class="prediction-display" id="signal-text">SMALL</div>

            <div class="accuracy-bar">
                ACCURACY: <strong style="color: #4ade80;">98%</strong>
            </div>

            <div class="btn-group">
                <button class="btn btn-exit" onclick="alert('Engine Active')">EXIT</button>
                <button class="btn btn-hide" onclick="toggleHide()">HIDE</button>
            </div>
        </div>
    </div>

    <script>
        // ইউজার চাইলে গেমের মূল লিংকটি এখানে আইফ্রেমে বসাতে পারে
        // যেমন: document.getElementById('gameFrame').src = "გেমের_লিংক_এখানে";

        function toggleHide() {
            let box = document.getElementById('overlayBox');
            if (box.style.display === 'none') {
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        // ডেমো হিসেবে পিরিয়ড ও সিগন্যাল আপডেট লজিক
        function updateOverlay() {
            const now = new Date();
            const epoch = Math.floor(now.getTime() / 1000);
            const periodSeq = 51800 + Math.floor((epoch % 86400) / 30);
            
            document.getElementById('live-period').innerText = periodSeq;
            
            let sig = (periodSeq % 2 === 0) ? "BIG" : "SMALL";
            let sigBox = document.getElementById('signal-text');
            sigBox.innerText = sig;
            sigBox.style.color = (sig === "BIG") ? "#4ade80" : "#ef4444";
        }

        setInterval(updateOverlay, 1000);
        updateOverlay();
    </script>
</body>
</html>
