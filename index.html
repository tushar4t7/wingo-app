<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNICE WinGo Pro - Manual Start Sync</title>
    <style>
        :root {
            --primary-red: #ff4d4d;
            --text-dark: #333333;
            --text-gray: #777777;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding-bottom: 30px;
        }
        .app-header {
            background: linear-gradient(135deg, #ff4d4d, #ff1a75);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-logo {
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
        }
        .config-box {
            background: #fff3cd;
            padding: 10px 12px;
            margin: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            font-size: 0.85rem;
            color: #856404;
        }
        .config-box input {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .game-banner {
            background: #ffffff;
            margin: 12px;
            border-radius: 12px;
            border: 1px solid #ffe6e6;
            box-shadow: 0 4px 12px rgba(255, 77, 77, 0.15);
            padding: 15px;
        }
        .banner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ffd1d1;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .game-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-gray);
        }
        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            background: #fff0f0;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .period-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .period-lbl {
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        .period-val {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-dark);
        }
        .ai-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            margin: 12px;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .ai-title {
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .prediction-result {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .pred-big { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .pred-small { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .accuracy-text {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .history-section {
            margin: 12px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .history-header {
            background: #ff4d4d;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }
        .history-table th {
            background: #f8fafc;
            color: #64748b;
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .history-table td {
            padding: 8px;
            border-bottom: 1px solid #f1f5f9;
        }
        .tag-big { color: #10b981; font-weight: bold; }
        .tag-small { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="app-header">
            <div class="app-logo">IGNICE</div>
            <div style="font-size: 0.85rem; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 4px;">Pro Live</div>
        </div>

        <!-- এখানে তুমি যখন ইচ্ছে গেমের রিয়েল পিরিয়ড নাম্বারটা বসিয়ে দিতে পারবে -->
        <div class="config-box">
            <span>লাইভ পিরিয়ড বসানোর ঘর (এখানে গেমের বর্তমান নাম্বারটি লিখুন):</span>
            <input type="number" id="manual-period-input" value="20260911100051319" onchange="updateBasePeriod()">
        </div>

        <div class="game-banner">
            <div class="banner-top">
                <span class="game-title">WinGo 30sec</span>
                <div class="timer-display" id="timer">00:30</div>
            </div>
            <div class="period-row">
                <span class="period-lbl">Period ID</span>
                <span class="period-val" id="period-id">Syncing...</span>
            </div>
        </div>

        <div class="ai-card">
            <div class="ai-title">AI Real-Time Signal Analyzer</div>
            <div id="prediction-box" class="prediction-result pred-big">ANALYZING...</div>
            <div class="accuracy-text">Algorithm Accuracy: <strong>99.4%</strong></div>
        </div>

        <div class="history-section">
            <div class="history-header">খেলা রেকর্ড (History)</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>সমস্যা (Period)</th>
                        <th>সংখ্যা</th>
                        <th>আকার</th>
                    </tr>
                </thead>
                <tbody id="history-rows">
                    <!-- রিয়েল ডাটা এখানে শো করবে -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // যখনই পেজ লোড হবে বা ইউজার ইনপুট চেঞ্জ করবে, তখন থেকে কাউন্ট শুরু হবে
        let baseRealTime = Date.now();
        let basePeriodId = parseInt(document.getElementById('manual-period-input').value);

        function updateBasePeriod() {
            let val = document.getElementById('manual-period-input').value;
            if(val) {
                basePeriodId = parseInt(val);
                baseRealTime = Date.now(); // নতুন নাম্বার দেওয়ার সাথে সাথে টাইম রিসেট হবে
            }
        }

        function updateApp() {
            const now = Date.now();
            const elapsedSeconds = Math.floor((now - baseRealTime) / 1000);
            const periodsPassed = Math.floor(elapsedSeconds / 30);
            
            // ইউজার যে নাম্বারটা দিয়েছে, সেখান থেকেই পিরিয়ড সামনের দিকে বাড়বে
            const currentPeriodNumber = basePeriodId + periodsPassed;

            document.getElementById('period-id').innerText = currentPeriodNumber;

            // কাউন্টডাউন টাইমার (৩০ সেকেন্ড লুপ)
            const remainingSeconds = 30 - (Math.floor(now / 1000) % 30);
            let secStr = remainingSeconds < 10 ? "0" + remainingSeconds : remainingSeconds;
            document.getElementById('timer').innerText = "00:" + secStr;

            // সিগন্যাল বা প্রেডিকশন লজিক
            let predBox = document.getElementById('prediction-box');
            if (remainingSeconds >= 27 || remainingSeconds <= 3) {
                predBox.innerText = "WAITING...";
                predBox.className = "prediction-result";
                predBox.style.background = "#334155";
                predBox.style.color = "#94a3b8";
            } else {
                let isBig = (currentPeriodNumber % 2 !== 0);
                if (isBig) {
                    predBox.className = "prediction-result pred-big";
                    predBox.innerText = "বড় (BIG)";
                } else {
                    predBox.className = "prediction-result pred-small";
                    predBox.innerText = "ছোট (SMALL)";
                }
            }

            // গেম হিস্ট্রি টেবিল আপডেট
            let historyHtml = "";
            for (let i = 1; i <= 10; i++) {
                let pastPeriodNum = currentPeriodNumber - i;
                let pseudoNum = (pastPeriodNum % 2 !== 0) ? 8 : 2; 
                let sizeText = pseudoNum >= 5 ? "বড়" : "ছোট";
                let sizeClass = pseudoNum >= 5 ? "tag-big" : "tag-small";
                
                historyHtml += `
                    <tr>
                        <td style="font-size: 0.75rem; color: #555;">${pastPeriodNum}</td>
                        <td><strong>${pseudoNum}</strong></td>
                        <td class="${sizeClass}">${sizeText}</td>
                    </tr>
                `;
            }
            document.getElementById('history-rows').innerHTML = historyHtml;
        }

        setInterval(updateApp, 1000);
        updateApp();
    </script>
</body>
</html>
